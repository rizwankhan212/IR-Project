# ============================================================
# CI/CD Pipeline — Build, Push, and Deploy ResearchSphere
# ============================================================
# This workflow:
#   1. Builds a Docker image from the project
#   2. Pushes it to GitHub Container Registry (GHCR)
#   3. Uses Terraform to provision/update AWS infrastructure
#   4. Deploys the container to EC2 instances via Auto Scaling
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID      — AWS IAM access key
#   AWS_SECRET_ACCESS_KEY  — AWS IAM secret key
#   AWS_REGION             — Target AWS region (e.g. us-east-1)
#   EC2_KEY_PAIR_NAME      — (Optional) EC2 key pair for SSH
# ============================================================

name: CI/CD — Build & Deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:     # Allow manual triggers

# Ensure only one deployment runs at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Build & Push Docker Image
  # ────────────────────────────────────────────────────────────
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Set Lowercase Image Name
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "DOCKER_IMAGE=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: 🔨 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Image summary
        run: |
          echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.DOCKER_IMAGE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # Job 2: Deploy Infrastructure with Terraform
  # ────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_docker_image: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
      TF_VAR_ghcr_username: ${{ github.actor }}
      TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      TF_VAR_key_pair_name: ${{ secrets.EC2_KEY_PAIR_NAME }}


    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Set Lowercase Docker Image Name
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository }}:latest" | tr '[:upper:]' '[:lower:]')
          echo "TF_VAR_docker_image=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: 🪣 Setup S3 Backend for Terraform State
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          BUCKET="researchsphere-state-${{ github.repository_owner }}"
          BUCKET_LOWER=$(echo "$BUCKET" | tr '[:upper:]' '[:lower:]')
          echo "TF_STATE_BUCKET=$BUCKET_LOWER" >> $GITHUB_ENV

          echo "Checking S3 state bucket $BUCKET_LOWER..."
          if aws s3api head-bucket --bucket "$BUCKET_LOWER" 2>/dev/null; then
            echo "Bucket already exists."
          else
            REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
            echo "Creating bucket $BUCKET_LOWER in $REGION..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_LOWER" --region us-east-1
            else
              aws s3api create-bucket --bucket "$BUCKET_LOWER" --region "$REGION" --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET_LOWER" --versioning-configuration Status=Enabled
          fi

          # Initial S3 Migration: if state does not exist in S3 yet, clean up conflicting orphaned ALB/TG from earlier runs
          if ! aws s3api head-object --bucket "$BUCKET_LOWER" --key "researchsphere/terraform.tfstate" 2>/dev/null; then
            echo "State not found in S3. Cleaning up any conflicting orphaned resources from previous runs..."
            aws autoscaling delete-auto-scaling-group --auto-scaling-group-name researchsphere-asg --force-delete 2>/dev/null || true
            ALB_ARN=$(aws elbv2 describe-load-balancers --names researchsphere-alb --query "LoadBalancers[0].LoadBalancerArn" --output text 2>/dev/null || true)
            if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
              echo "Deleting orphan ALB: $ALB_ARN"
              aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN"
              echo "Waiting 15s for ALB deletion..."
              sleep 15
            fi
            TG_ARN=$(aws elbv2 describe-target-groups --names researchsphere-tg --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || true)
            if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
              echo "Deleting orphan Target Group: $TG_ARN"
              aws elbv2 delete-target-group --target-group-arn "$TG_ARN" 2>/dev/null || true
            fi
          fi

      - name: 🔍 Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=researchsphere/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}"

      - name: 📝 Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: 📊 Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan -input=false

      - name: 🚀 Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: 📤 Capture Terraform Outputs
        working-directory: ./terraform
        id: tf_output
        run: |
          echo "alb_url=$(terraform output -raw alb_url)" >> $GITHUB_OUTPUT
          echo "asg_name=$(terraform output -raw asg_name)" >> $GITHUB_OUTPUT

      - name: 🔄 Trigger ASG Instance Refresh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "${{ steps.tf_output.outputs.asg_name }}" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}' \
            || echo "Instance refresh may already be in progress"

      - name: 📋 Deployment Summary
        run: |
          echo "### 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Application URL** | ${{ steps.tf_output.outputs.alb_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **ASG Name** | ${{ steps.tf_output.outputs.asg_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Image** | \`${{ env.TF_VAR_docker_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Important:** Always open with **http://** (not https). If the URL shows \`***\`, replace \`***\` with your AWS region (\`${{ secrets.AWS_REGION || 'us-east-1' }}\`)." >> $GITHUB_STEP_SUMMARY
          echo "> ⏳ The application may take 2-3 minutes to become available after deployment." >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # Job 3: Terraform Plan on PRs (review before merge)
  # ────────────────────────────────────────────────────────────
  plan:
    name: 📝 Terraform Plan (PR Preview)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
      TF_VAR_aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TF_VAR_docker_image: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
      TF_VAR_ghcr_username: ${{ github.actor }}
      TF_VAR_ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      TF_VAR_key_pair_name: ${{ secrets.EC2_KEY_PAIR_NAME }}


    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🏷️ Set Lowercase Docker Image Name
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository }}:latest" | tr '[:upper:]' '[:lower:]')
          echo "TF_VAR_docker_image=$IMAGE_LOWER" >> $GITHUB_ENV

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: 🪣 Setup S3 Backend for Terraform State
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          BUCKET="researchsphere-state-${{ github.repository_owner }}"
          BUCKET_LOWER=$(echo "$BUCKET" | tr '[:upper:]' '[:lower:]')
          echo "TF_STATE_BUCKET=$BUCKET_LOWER" >> $GITHUB_ENV

          echo "Checking S3 state bucket $BUCKET_LOWER..."
          if aws s3api head-bucket --bucket "$BUCKET_LOWER" 2>/dev/null; then
            echo "Bucket already exists."
          else
            REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
            echo "Creating bucket $BUCKET_LOWER in $REGION..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET_LOWER" --region us-east-1
            else
              aws s3api create-bucket --bucket "$BUCKET_LOWER" --region "$REGION" --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET_LOWER" --versioning-configuration Status=Enabled
          fi

      - name: 🔍 Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=researchsphere/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}"

      - name: 📊 Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false -no-color
        continue-on-error: true

