# ============================================================
# Terminate & Destroy AWS Resources Workflow (1-Click)
# ============================================================
# Allows terminating/destroying all AWS cloud resources in 1 click
# from the GitHub Actions "Run workflow" button.
#
# Options:
#   1. full_destroy (Default): Runs 'terraform destroy' using the S3
#      remote backend to cleanly delete ALL AWS resources (ALB, ASG,
#      EC2, VPC, Subnets, Security Groups, CloudWatch Alarms).
#   2. scale_to_zero: Quickly scales Auto Scaling Group to 0 and terminates
#      all running EC2 instances to immediately stop compute billing.
#   3. destroy_all_and_s3: Destroys all infrastructure AND deletes
#      the S3 Terraform state bucket for 100% complete cleanup.
# ============================================================

name: 🛑 Terminate AWS Resources (1-Click)

on:
  workflow_dispatch:
    inputs:
      action_mode:
        description: "Select Termination Action"
        required: true
        default: "full_destroy"
        type: choice
        options:
          - "full_destroy"
          - "scale_to_zero"
          - "destroy_all_and_s3"

concurrency:
  group: cloud-cleanup
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────
  # Action 1: Scale ASG to 0 & Terminate EC2 Instances Immediately
  # ────────────────────────────────────────────────────────────
  scale-to-zero:
    name: 🛑 Scale to 0 (Stop Compute Billing)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action_mode == 'scale_to_zero' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Sanitize & Export AWS Credentials
        run: |
          CLEAN_KEY=$(echo -n "${{ secrets.AWS_ACCESS_KEY_ID }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          CLEAN_SECRET=$(echo -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          CLEAN_REGION=$(echo -n "${{ secrets.AWS_REGION || 'us-east-1' }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")

          echo "::add-mask::$CLEAN_KEY"
          echo "::add-mask::$CLEAN_SECRET"

          echo "AWS_ACCESS_KEY_ID=$CLEAN_KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$CLEAN_SECRET" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$CLEAN_REGION" >> $GITHUB_ENV
          echo "AWS_REGION=$CLEAN_REGION" >> $GITHUB_ENV

      - name: ⚙️ Scale Down Auto Scaling Group to 0
        id: scale_asg
        run: |
          ASG_NAME="researchsphere-asg"
          echo "Scaling down ASG: $ASG_NAME to min=0, desired=0..."
          if aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" --query "AutoScalingGroups[0].AutoScalingGroupName" --output text 2>/dev/null | grep -q "$ASG_NAME"; then
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name "$ASG_NAME" \
              --min-size 0 \
              --desired-capacity 0
            echo "asg_status=scaled" >> $GITHUB_OUTPUT
            echo "✅ Auto Scaling Group $ASG_NAME successfully scaled to 0."
          else
            echo "asg_status=not_found" >> $GITHUB_OUTPUT
            echo "⚠️ Auto Scaling Group $ASG_NAME not found."
          fi

      - name: 💥 Force Terminate Any Active EC2 Instances
        id: terminate_ec2
        run: |
          echo "Scanning for active project EC2 instances..."
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=researchsphere" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text 2>/dev/null || echo "")

          if [ -n "$INSTANCE_IDS" ] && [ "$INSTANCE_IDS" != "None" ]; then
            echo "Found active instances: $INSTANCE_IDS"
            aws ec2 terminate-instances --instance-ids $INSTANCE_IDS
            echo "terminated_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
            echo "count=$(echo $INSTANCE_IDS | wc -w)" >> $GITHUB_OUTPUT
          else
            echo "No active EC2 instances found."
            echo "terminated_ids=None" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: 📋 Summary
        run: |
          echo "### 🛑 Cloud Compute Instances Terminated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Action | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Auto Scaling Group** | Scaled to 0 (min=0, desired=0) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Terminated Instances** | \`${{ steps.terminate_ec2.outputs.terminated_ids }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Instances Terminated Count** | ${{ steps.terminate_ec2.outputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Compute Billing Status** | 🛑 **STOPPED** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All EC2 instances terminated. VPC and ALB are preserved for fast re-deployment." >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # Action 2: Complete Terraform Destroy (Full Infrastructure Cleanup)
  # ────────────────────────────────────────────────────────────
  terraform-destroy:
    name: 💥 Full Infrastructure Destroy
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.action_mode == 'full_destroy' || github.event.inputs.action_mode == 'destroy_all_and_s3' || github.event.inputs.action_mode == '' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Sanitize & Export AWS Credentials
        run: |
          CLEAN_KEY=$(echo -n "${{ secrets.AWS_ACCESS_KEY_ID }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          CLEAN_SECRET=$(echo -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")
          CLEAN_REGION=$(echo -n "${{ secrets.AWS_REGION || 'us-east-1' }}" | tr -d '[:space:]' | tr -d '"' | tr -d "'")

          echo "::add-mask::$CLEAN_KEY"
          echo "::add-mask::$CLEAN_SECRET"

          echo "AWS_ACCESS_KEY_ID=$CLEAN_KEY" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$CLEAN_SECRET" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=$CLEAN_REGION" >> $GITHUB_ENV
          echo "AWS_REGION=$CLEAN_REGION" >> $GITHUB_ENV
          echo "TF_VAR_aws_access_key=$CLEAN_KEY" >> $GITHUB_ENV
          echo "TF_VAR_aws_secret_key=$CLEAN_SECRET" >> $GITHUB_ENV
          echo "TF_VAR_aws_region=$CLEAN_REGION" >> $GITHUB_ENV

          # Lowercase image variable for terraform validation
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository }}:latest" | tr '[:upper:]' '[:lower:]')
          echo "TF_VAR_docker_image=$IMAGE_LOWER" >> $GITHUB_ENV

          BUCKET="researchsphere-state-${{ github.repository_owner }}"
          echo "TF_STATE_BUCKET=$(echo "$BUCKET" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: 🔍 Terraform Init (Connect to S3 Remote State)
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=researchsphere/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_DEFAULT_REGION }}"

      - name: 💥 Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve -input=false

      - name: 🪣 (Optional) Delete S3 State Bucket
        if: ${{ github.event.inputs.action_mode == 'destroy_all_and_s3' }}
        run: |
          echo "Emptying and deleting S3 state bucket: ${{ env.TF_STATE_BUCKET }}..."
          aws s3 rb "s3://${{ env.TF_STATE_BUCKET }}" --force || echo "Bucket already deleted or empty"

      - name: 📋 Summary
        run: |
          echo "### 💥 Full AWS Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2 Instances** | 🗑️ Terminated |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auto Scaling Group** | 🗑️ Deleted |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application Load Balancer** | 🗑️ Deleted |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Groups** | 🗑️ Deleted |" >> $GITHUB_STEP_SUMMARY
          echo "| **Security Groups** | 🗑️ Deleted |" >> $GITHUB_STEP_SUMMARY
          echo "| **VPC & Subnets** | 🗑️ Deleted |" >> $GITHUB_STEP_SUMMARY
          echo "| **CloudWatch Alarms** | 🗑️ Deleted |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All AWS resources created for ResearchSphere have been completely terminated and destroyed." >> $GITHUB_STEP_SUMMARY
